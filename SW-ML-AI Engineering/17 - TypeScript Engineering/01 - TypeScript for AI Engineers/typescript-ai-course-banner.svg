      <text x="18" y="44" text-anchor="middle" fill="#7dd3fc">Next</text>
      <rect x="0"  y="92"  width="36" height="16" rx="3" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="18" y="104" text-anchor="middle" fill="#7dd3fc">Wrk</text>
      <rect x="0"  y="152" width="36" height="16" rx="3" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="18" y="164" text-anchor="middle" fill="#7dd3fc">LC</text>
      <rect x="194" y="32"  width="36" height="16" rx="3" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="212" y="44" text-anchor="middle" fill="#93c5fd">Edge</text>
      <rect x="194" y="92"  width="36" height="16" rx="3" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="212" y="104" text-anchor="middle" fill="#93c5fd">API</text>
      <rect x="194" y="152" width="36" height="16" rx="3" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="212" y="164" text-anchor="middle" fill="#93c5fd">SSR</text>
    </g>
    <g transform="translate(115, 100)">
      <polygon points="-40,0 0,-32 40,0 0,32" fill="url(#diamond)" stroke="#f8fafc" stroke-width="1.2"/>
      <polygon points="-22,0 0,-18 22,0 0,18" fill="#0c1426" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">TS</text>
    </g>
    <text x="115" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc" letter-spacing="2">STACK</text>
  </g>
  <rect x="0" y="356" width="1200" height="4" fill="url(#accent)"/>
</svg>